<h2 id="part-1" class="slide-part-title">Part 1: Morphological Classification of Ellipticals</h2>

<!--

-->

- <span class="fragment">**Hubble Ellipticity Index ($E0 \text{--} E7$):** Classified by apparent major ($a$) and minor ($b$) axis ratios:</span>
  <span class="fragment">$$E = 10 \left(1 - \frac{b}{a}\right)$$</span>
- <span class="fragment">**Flattened Systems ($E4 \text{--} E8$ / $S0$):** High ellipticity often indicates edge-on fast-rotating disks or lenticular galaxies without visible arms.</span>
- <span class="fragment">**Compact Ellipticals ($cE$):** Small, dense, high-surface-brightness systems (e.g., M32); formed primarily as tidal remnants stripped by a massive neighbor.</span>
- <span class="fragment">**Central Dominant Galaxies ($cD$):** Supergiant ellipticals surrounded by vast, faint, extended stellar envelopes. Usually found at the centers of rich clusters.</span>

<h2 id="part-2" class="slide-part-title">Part 2: Intrinsic 3D Shapes & Kinematic Support</h2>

<!--[i="image_agent_tag_783226219513890030"]-->

- <span class="fragment">**De-projecting Ellipticity:** Apparent 2D shape depends on intrinsic 3D semi-axes ($a \ge b \ge c$) and inclination.</span>
- <span class="fragment">**The Ellipsoidal Families:**</span>
  * <span class="fragment">**Oblate (Disc-like):** $a = b > c$ (flattened along the axis of rotation).</span>
  * <span class="fragment">**Prolate (Sausage-like):** $a > b = c$ (elongated along the major axis).</span>
  * <span class="fragment">**Triaxial (General):** $a > b > c$ (three distinct principal axes; orbits can be non-planar).</span>

-v-

## Kinematics:
- Stars in a gravity well have some balance of:
  - Coherent **rotational velocity** ($V_{\rm rot}$) - from the difference in mean doppler shift across the galaxy
  - Random **anisotropic stellar "pressure"** ($\sigma$) - from the broadening in individual absorption lines (corrected for instrumental broadening)
- The $V/\sigma$ ratio is a key divider between disc-like and elliptical galaxies. 
  - Faint/low-mass ellipticals are isotropic oblate rotators ($V/\sigma > 1$)
  - <span class="fragment">Giant ellipticals are slow-rotating, pressure-supported systems ($V/\sigma \ll 1$), often with triaxial shapes.</span>

<h2 id="part-3" class="slide-part-title">Part 3: Other Features of Ellipticals</h2>

- **Stellar populations**
  - <span class="fragment">Dominated by Population II stars</span>
  - <span class="fragment">Very little gas between stars</span>
  - <span class="fragment">Very low star formation rates</span>
- <span class="fragment">**Supermassive Black Holes**</span>
  - <span class="fragment">Most (all?) ellipticals host a large central black hole (some with jets)</span>
- <span class="fragment">**Globular Clusters** (dense/old stellar clusters):</span>
  - <span class="fragment">Nearby ellipticals like M87 show 100x that of the Milky Way</span>

<h2 id="part-4" class="slide-part-title">Part 4: Galaxy Demographics & Locations</h2>

<div style="text-align: center; width: 100%;"><img src="../slide_data/slide_images/Galaxy_mass_function.png" class="r-stretch" /></div>

- <span class="fragment">By **Number Density ($\Phi$)**: Late-type spirals (Sab–Sd) and dwarf/irregular galaxies (Sd–Irr, dE) dominate counts.</span>
-v-
- <span class="fragment">By **Stellar Mass Budget ($\rho_*$)**: Spheroid-dominated elliptical galaxies hold the majority of mass ($\sim 71\%$ of total stellar mass resides in Es + S0/Sas).</span>
- <span class="fragment">When split only by bulge- vs disc-dominated (i.e. ellipticals & bulge-dominated lenticulars vs spirals), the nearby universe shows a ~50/50 split by mass</span>
- Best statistics from [GAMA](https://arxiv.org/abs/1407.7555) survey.

-v-

<!--[i="image_agent_tag_783226219513890192"]-->
- The local density of galaxies can vary from sparse environments to large superclusters.
- <span class="fragment">**The Morphology-Density Relation (Dressler 1980):** Spiral galaxies dominate low-density field environments; $S0$ and $E$ galaxies dominate densest regions of clusters (80-90%).</span>
- <span class="fragment">**$cD$ Galaxies at Potential Well Minima:** Located at the exact gravitational centers of massive clusters (e.g., M87 in Virgo, ESO 137-001).</span>
- <span class="fragment">**Galactic Cannibalism & Intracluster Light (ICL):** $cD$ envelopes grow by accreting smaller cluster members; tidal disruption scatters stars into the extended ICL halo.</span>

<h2 id="part-5" class="slide-part-title">Part 5: The Low-Mass Zoo: Dwarf Galaxies</h2>

<div style="text-align: center; width: 100%;"><img src="../slide_data/slide_images/Dwarf_Galaxies_examples.png" class="r-stretch" /></div>

-v-

- <span class="fragment">**Dwarf Ellipticals ($dE$) & Spheroidals ($dSph$):** Gas-poor, smooth stellar distributions ($M_V > -18$). $dSph$ systems are extreme, low-surface-brightness extensions ($M_V > -14$).</span>
- <span class="fragment">**Ultra-Faint Dwarfs ($UFDs$):** The faintest, most dark-matter-dominated systems known ($L \sim 10^2\text{--}10^5 L_\odot$, $M/L > 100\text{--}1000$).</span>
- <span class="fragment">**Ultra-Diffuse Galaxies ($UDGs$):** Dwarf-like stellar mass ($10^7\text{--}10^8 M_\odot$) expanded over a Milky Way-sized spatial radius ($R_e \ge 1.5\text{ kpc}$).</span>
- <span class="fragment">**Dwarf Irregulars ($dIrr$):** Gas-rich, actively star-forming dwarfs with irregular morphologies and low metallicities.</span>

<h2 id="part-6" class="slide-part-title">Part 6: Scaling relations (basics)</h2>

- <span class="fragment">The many properties of galaxies (size, mass, rotational speed/velocity dispersion, luminosity, etc) are not infinitely variable.</span>
- <span class="fragment">Instead there exists underlying physics which produces strong correlations between parameters.</span>
- <span class="fragment">These are modelled via "scaling relations"</span>
- <span class="fragment">For example, one scaling relation is a constant **mass-to-light ratio** (i.e. $M \propto L$)</span>
- <span class="fragment">This is understandable as higher stellar mass must produce higher luminosities.</span>

-v-

<h2 id="part-7" class="slide-part-title">Part 7: Scaling relations (velocities)</h2>

### Tully-Fisher

<div style="text-align: center; width: 100%;"><img src="../slide_data/slide_images/tully_fisher.jpg" class="r-stretch" /></div>

- In spiral galaxies, rotational velocity correlates strongly with luminosity: $L \propto \nu^\alpha_{\rm max}$, where $\alpha \approx 4$ in spirals

<!-- Connects total optical/IR luminosity (or baryonic mass) to maximum disk rotation speed ($V_{\text{max}}$):- $$L \propto V_{\text{max}}^{\alpha} \quad (\alpha \approx 3\text{--}4)$$-->
-v-
### Tully-Fisher

- <span class="fragment">Tully & Fisher (1977) realised that total optical/IR luminosity (or baryonic mass) is linked to maximum disk rotation speed</span>
- <span class="fragment">Assuming constant mass-to-light ratio ($M = cL$), rotational velocity defined as $v_{\rm max} = \sqrt{GM/R}$, and mean surface brightness $\mu = L/R^2$, what relation should $L$ and $v$ have?</span>
- <span class="fragment">$R^2 = G^2M^2/v^4_{\rm max}$; hence ... $R^2 = cG^2L^2/v^4_{\rm max}$</span>
- <span class="fragment">So $L = \mu R^2$; $L = \mu cG^2L^2/v^4_{\rm max}$; $L = \nu^4_{\rm max}/(cG^2\mu)$</span>
- <span class="fragment">As $c$ (mass-to-light proportionality) and $\mu$ (surface brightness ratio) can be assumed constant for all spirals, $L \propto v^4_{\rm max}$.</span>

-v-

## Faber-Jackson

<div style="text-align: center; width: 100%;"><img src="../slide_data/slide_images/Tully_Fischer.png" class="r-stretch" /></div>

- In **elliptical galaxies**, faster velocity _dispersions_ in their cores ($\sigma_0$) correlate with higher luminosities: $L \propto \sigma_0^\gamma \quad (\gamma \approx 4)$
- <span class="fragment">This can similarly be derived from expected velocities due to galaxy masses.</span>

-v-
## Physical Basis

- As with Tully-Fisher, Faber-Jackson can be derived by combining:
  - <span class="fragment">The **virial theorem** - e.g. using equilibrium in gravitational potential ($G M / R \propto V^2$); and</span>
  - <span class="fragment">A constant (or slowly varying) stellar mass-to-light ratio ($M/L$)</span>
-v-
### Derivation of Faber-Jackson I:
- Potential energy from point masses inside radius R is $U = -\frac{3}{5}\frac{GM^2}{R}$
- <span class="fragment">Total kinetic energy, when derived from velocity dispersion along only the $z$ direction ($\sigma$), is $K = \frac{1}{2}M\langle v \rangle = \frac{1}{2} M (3\sigma^2) = \frac{3}{2} M \sigma^2$</span>
- <span class="fragment">In a stable bound system, the average particle sits halfway to espace velocity ($ K = \frac{1}{2}|U| $)</span>
- <span class="fragment">Potential in a gravitational well is always negative</span>
- <span class="fragment">Hence, in stable systems; $K + \frac{1}{2}U = 0$.</span>
- <span class="fragment">Substituting gives: $\frac{3}{2} M \sigma^2 - \frac{3}{10}\frac{GM^2}{R} = 0$; $ \sigma^2 = \frac{1}{5}\frac{GM}{R}$</span>

-v-

### Derivation of Faber-Jackson II:
- <span class="fragment">If M/L is constant, then we can substitute M for L, i.e. $\sigma^2 \propto \frac{1}{5}\frac{GL}{R}$</span>
- <span class="fragment">Removing constants: $\sigma^2 \propto \frac{L}{R}$</span>
- <span class="fragment">Total luminosity within $R$ from surface brightness is $L = 4\pi R^2 \mu$</span>
- <span class="fragment">Rearranging: $R = \sqrt{\frac{L}{4\pi \mu}}$</span>
- <span class="fragment">Substituting gives $ \sigma^2 \propto \frac{L}{\sqrt{L/\mu}} $, so $ \sigma^4 \propto \frac{\mu L^2}{L} \propto \mu L $</span>
- <span class="fragment">Assuming constant $\mu$: $$L \propto \sigma^4$$</span>

<h2 id="part-8" class="slide-part-title">Part 8: Scaling velocities (fundamental plane)</h2>

- <span class="fragment">The brightness profiles of ellipticals  makes calculating the _total flux_ difficult</span>
- <span class="fragment">It is easier to compute the effective radius, $R_e$, where 50% surface brightness is reached.</span>
- <span class="fragment">Unlike spiral galaxies, the surface brightness of ellipticals varies substantially with galactic luminosity: $L \propto \mu^{-0.66}$ - larger ellipticals have lower surface brightnesses.</span>
- <span class="fragment">Using both surface brightnesses ($\mu$) and velocity disperson ($\sigma_0$) corrects for this change: $R_e \propto \sigma_0^{1.4} \mu^{-0.85}$.</span>
- <span class="fragment">In logarithmic quantities $\log_{10} R_e = a \log_{10} \sigma_0 + b \log_{10} \mu + c$ where $a \approx 1.2\text{--}1.4$, $b \approx -0.85\to-0.90$)</span>

-v-

## Fundamental plane

<div style="text-align: center; width: 100%;"><img src="../slide_data/slide_images/mFP_vp_rotate.gif" class="r-stretch" /></div>

- This can be thought of a third dimension to the Faber-Jackson and is a _better predictor_ of galaxy size/luminosity

-v-

## Fundamental plane

<div style="text-align: center; width: 100%;"><img src="../slide_data/slide_images/fundamental_plane_2.gif" class="r-stretch" /></div>

- This can be thought of a third dimension to the Faber-Jackson and is a _better predictor_ of galaxy size/luminosity

-v-

### Understanding the "Tilt":

- <span class="fragment">Pure Virial Theorem ($M \propto R_e \sigma_0^2$) predicts $a = 2.0, b = -1.0$.</span>
- <span class="fragment">The discrepancy ("tilt") reflects systematic variations in $M/L$:</span>
  - <span class="fragment">$M/L$ of ellipticals increases with galaxy stellar mass.</span>
  - Why? **Dark matter**

<h2 id="part-10" class="slide-part-title">Part 10: Impact of scaling relations</h2>

#### Standard candles

- <span class="fragment">Relations between parameters enable us to convert one observed parameter into another</span>
  - <span class="fragment">e.g. velocity disperson $\sigma$ to mass (and therefore to intrinsic luminosity).</span>
  - <span class="fragment">This can anchor a standard candle (e.g. for distance, and even $H_0$ determination)</span>

<span class="fragment">#### Unresolved galaxies</span>

- <span class="fragment">Enable us to apply information derived from resolved calaxies to distant galaxies without any spatial (e.g. $V$ or $\langle I_e \rangle$) information</span>

<span class="fragment">#### Probe underlying physics</span>

- <span class="fragment">For example, deviations of observed scaling laws from expectations as proof of unseen physics (Fundamental plane "tilt" due to increasing dark matter mass fraction in massive galaxies)</span>
