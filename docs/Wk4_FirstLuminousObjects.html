<h2 id="part-2" class="slide-part-title">Part 2: Recombination</h2>

## Ionization basics
- <span class="fragment">Neutral Atom: Protons in the nucleus hold negatively charged electrons in bound orbits.</span>
- <span class="fragment">Ionization Energy: Stripping an electron from Hydrogen requires a minimum energy of $13.6\text{ eV}$ (from $E = h\nu = \frac{hc}{\lambda}$; $\lambda<911{\text \AA}$)</span>
- <span class="fragment">Ionization Process: High-energy Ultraviolet (UV) photons strike neutral Hydrogen ($H\ I$), ejecting the electron.</span>
- <span class="fragment">Ionized State: Gas converts into a plasma of free protons and free electrons ($H\ II$).</span>

-v-

## The CMB
- <span class="fragment">The early universe was **hot, dense, & expanding**</span>
- <span class="fragment">High temperatures meant electrons were initially unable to combine with nuclei/protons (**ionized plasma**)</span>
- <span class="fragment">**Thomson scattering** with the sea of electrons meant photons had very short *mean free paths*</span>
- <span class="fragment">Any local fluctuations in density are dispersed by radiation pressure setting up sound waves (**"Baryon Acoustic Oscillations"**)</span>
- <span class="fragment">The expanding universe cooled such that fewer than 1 photon per baryon had $E>13.6\text{ eV}$ (or $\lambda<911{\text \AA}$)</span>
- <span class="fragment">Free electons could bind with protons to form neutral Hydrogen ($H\ I$) without being reionized</span>
- <span class="fragment">The disappearance of free electrons meant photon *mean free paths* grew rapidly to $\ell \gg H^{-1}$, releasing photons we can still observe as the **cosmic microwave background (CMB)**</span>

-v-

## The CMB

<div style="text-align: center; width: 100%;"><img src="../slide_data/slide_images/cmb1.jpg" class="r-stretch" /></div>

-v-

## Neutral era "Cosmic Dawn"
- <span class="fragment">Neutral $H\ I$ is transparent to photons...</span>
  - <span class="fragment">Except photons with $\lambda<911{\text \AA}$ which are absorbed through ionization ($H\ I \to H^{+} + e^{-}$).</span>
  - <span class="fragment">Accounting for cosmic red-shift, this means we cannot expect *any* light $<1\mu{\rm m}$ from the universe beyond $z \gtrsim 10$</span>
- <span class="fragment">However, in this initial cooling universe, there are almost no sources of photons.</span>
  - <span class="fragment">These are the **Cosmic Dark Ages**</span>
  - <span class="fragment">Only the 21cm line shines (e$^{-}$ & H$^{+}$ spin-flip transition)</span>

<h2 id="part-3" class="slide-part-title">Part 3: Collapsing matter</h2>

<div style="text-align: center; width: 100%;"><img src="../slide_data/slide_images/DarkMatterFilaments.png" style="width: 100%; max-height: 620px; object-fit: contain; display: block; margin: 0 auto;" /></div>

- **The Cosmic Dark Ages**:
- <span class="fragment">Cold, dark, uniform gas (75% Hydrogen, 25% Helium) without any light sources.</span>
- <span class="fragment">Limited gas overdensities due to radiation drag before recombination.</span>
- <span class="fragment">Dominated by dark matter, but no interactions means no "drag" limiting self-gravitation...</span>
-v-

### Gravitational Collapse
- <span class="fragment">Erly universe was remarkable smooth (see inflation)</span>
- <span class="fragment">But small-scale fluctuations in dark matter gradually clump into structures (even before recombination).</span>
- <span class="fragment">Densest regions form at the intersection of filaments - so-called **mini-halos** with masses of $\sim 10^6\text{ M}_\odot$.</span>
  - <span class="fragment">Predicted by simulations; see part 5.</span>
- <span class="fragment">By $z\sim20$ neutral gas falls into these gravitation wells at speeds of $v_{\text{vir}} \sim 2\text{--}5\text{ km/s}$, heating the gas via shocks to $T_{\text{vir}} \sim 1000\text{ K}$.</span>

<h2 id="part-4" class="slide-part-title">Part 4: The first stars & galaxies</h2>

### Forming population III Stars - Cooling
- <span class="fragment">Low $T_{\text{vir}}$ blocks efficient Ly$\alpha$ cooling ($10.2\text{ eV}$ requires $T_{\text{vir}} \gtrsim 10^4\text{ K}$)</span>
- <span class="fragment">Lack of heavy elements means neutral H cannot cool below 1000K</span>
- <span class="fragment">Residual free electrons helps form H$_2$ molecules (small fraction), allowing rotational transitions to radiate heat ($1000\text{ K} \to 200\text{ K}$; $n_H \to \sim 10^4\text{ cm}^{-3}$).</span>
- <span class="fragment">H$\_{2}$ cooling means the local Jeans mass ($M_J \propto T^{3/2} \rho^{-1/2}$) drops to $M_J \sim 10^2\text{--}10^3 \, M_\odot$ - self-gravitational collapse can begin.</span>
- <span class="fragment">This may form multiple smaller dense regions via turbulence.</span>
- <span class="fragment">At $n_H \sim 10^8\text{ cm}^{-3}$ convert all H$\to$H$\_2$ (via $3H \to H_2 + H$ pathway).</span>

-v-
### Forming population III Stars - Accretion
- <span class="fragment">At $n_H \sim 10^{14}\text{ cm}^{-3}$, gas is optically thick to $H_2$ rovibrational lines and the core temperature rises adiabatically, forming a protostellar core ($M_{\text{proto}} \sim 10^{-2} \, M_\odot$).</span>
- <span class="fragment">Pristine gas at 200K has a very high sound speed ($c_s \approx 1.5\text{--}2.0\text{ km/s}$) enabling rapid accretion (1-10M_sun in 1000yrs!)</span>
- <span class="fragment">Kelvin-Helmholtz contraction during the accretion phase means the core gets hot & dense enough to begin Hydrogen fusion</span>
- <span class="fragment">The emitted UV radiation (Ly$\alpha$ continuum) photoevaporates the surrounding accreting material, switching off accretion.</span>

-v-

### Forming population III Stars - How many?

- A $10^6\text{ M}_\odot$ halo:
  - <span class="fragment">Contains $M_{\rm gas} \sim 1.6\times10^5\text{ M}_\odot$ neutral hydrogen</span>
  - <span class="fragment">Accretion efficiency of $$\epsilon_{\text{SF}} \approx 10^{-4} \text{ to } 10^{-3}$$(0.01 to 0.1%) due to photo-evaporative feedback.</span>
  - <span class="fragment">$$N_{\text{stars}} = \frac{\epsilon_{\text{SF}} . M_{\rm gas}}{M_{\text{Pop III}}} \approx \frac{1.6 \times 10^5 .(10^{-4} \text{ -- } 10^{-3})}{20 \text{--}100 \, M_\odot} \approx 1 \text{ to } 8 \text{ stars}$$</span>
  - <span class="fragment">Each halo produces only one or a handful of Pop III stars!</span>

-v-

### Evolutionary Paths & Explosive Ends

- Pop III star fates depend strictly on initial mass ($M_{\text{ZAMS}}$)

<div style="text-align: center; width: 100%;"><img src="https://upload.wikimedia.org/wikipedia/commons/1/18/Remnants_of_single_massive_stars.svg" style="width: 100%; max-height: 620px; object-fit: contain; display: block; margin: 0 auto;" /></div>

-v-
### Evolutionary Paths & Explosive Ends - low-mass

- <span class="fragment">$10\ M_{\text{ZAMS}} \lesssim M_{\text{ZAMS}} \lesssim 140\ M_{\odot}$ — **Core-Collapse Supernovae (CCSN)**:</span>
  - <span class="fragment">3-10Myr main sequence lifetime</span>
  - <span class="fragment">Standard iron-core collapse leaving a neutron star or black hole via fallback.</span>
  - <span class="fragment">Smallest stars ($<30\ M_{\odot}$) enriches the environment with $\sim80$% up to Fe</span>
  - <span class="fragment">Larger stars only minimally enriches the environment ($\sim20$%) with alpha elements (C, N, O).</span>

-v-

### Evolutionary Paths & Explosive Ends - intermediate-mass

- <span class="fragment">$140\ M_{\odot} \le M_{\text{ZAMS}} \le 260\ M_{\odot}$ — **Pair-Instability Supernovae (PISNe)**:</span>
  - <span class="fragment">2-3Myr main sequence lifetime</span>
  - <span class="fragment">Photon energies in the oxygen core become so high that they create electron-positron ($e^-e^+$) pairs, dropping thermal pressure and causing catastrophic collapse.</span>
  - <span class="fragment">Triggers runaway explosive oxygen and silicon burning that completely disrupts the star, leaving no central compact remnant.</span>
  - <span class="fragment">Massively enriches the surrounding gas, including in $^{56}$Ni which decays to Fe ($1\text{--}10$% by mass)</span>

-v-

### Evolutionary Paths & Explosive Ends - high-mass

- <span class="fragment">$M_{\text{ZAMS}} \gtrsim 260\ M_{\odot}$ — **Direct Collapse to Black Hole**:</span>
  - <span class="fragment"><2Myr main sequence lifetime</span>
  - <span class="fragment">Photodisintegration steals thermal energy, leading to collapse that runaway fusion cannot halt. The star collapses directly into an intermediate-mass black hole (IMBH).</span>
  - <span class="fragment">Little to no mass is ejected (minimal enrichment)</span>

-v-

### The resulting Dark Matter Halo

- <span class="fragment">Supernova, with winds of $1,000+\text{ km/s}$ blows all gas out of mini-halo into IGM</span>
- <span class="fragment">Dark Matter (and black hole) remain trapped within gravitational well</span>
- <span class="fragment">The halo enters a **sterile phase** with no gas or star formation for $>100$ Myr.</span>

-v-

### Hierarchical Merging
- <span class="fragment">The Dark Matter mass continues to grow through interactions with both **filaments**, and other halos.</span>
- <span class="fragment">Assembles via **Hierarchical Merging** to masses of $M_{\text{halo}} \gtrsim 10^8\text{--}10^9 \, M_\odot$.</span>
- <span class="fragment">Once the potential well grows deep enough ($v_{\text{esc}} > 10\text{--}15\text{ km/s}$), its gravity re-accretes gas, albeit heated by e.g. shocks to $T_{\text{vir}} \ge 10^4\text{ K}$</span>
- <span class="fragment">Unlike for Pop III formation, this gas is dominated by molecular hydrogen, enriched with metals from supernovae, and has $T_{\text{vir}}$ hot enough to cool via Ly$\alpha$ emission, enabling efficient cooling.</span>
- <span class="fragment">This unlocks rapid gas accretion from the IGM, and from narrow streams of gas which channel directly into central protogalactic disc.</span>
- <span class="fragment">This forms the first true galaxies, with gas-rich compositions, and rapid starbursts forming Population II stars.</span>

-v-

<h2 id="part-5" class="slide-part-title">Part 5: Simulating the Cosmic Dark Ages</h2>

- <span class="fragment">Without direct observations, theory & simulations are an important tool to understand how star & galaxy formation works.</span>
- <span class="fragment">This is especially true for understanding how matter & dark matter produce structures.</span>
- <span class="fragment">By simulating the cosmic dark ages, and comparing the aftermath with what we can observe in the distant universe, we can constrain underlying physics.</span>

-v-

## Tunable Physical Parameters
- <span class="fragment">**Cosmological Parameters** Density parameters ($\Omega_m, \Omega_b, \Omega_\Lambda$), Hubble constant ($h$), power spectrum amplitude ($\sigma_8$), and scalar spectral index ($n_s$).</span>
- <span class="fragment">**Dark Matter Microphysics**: Particle mass ($m_{\text{WDM}}$ in Warm Dark Matter models to set the small-scale power suppression scale), self-interaction cross-sections ($\sigma_{\text{SIDM}}$).</span>
- <span class="fragment">**Gas Microphysics & Primordial Chemistry**: Non-equilibrium network reaction rates for species ($H, H^+, H^-, He, He^+, He^{++}, e^-, H_2, H_2^+$), molecular hydrogen ($H_2$) and HD cooling efficiencies.</span>
- <span class="fragment">**Stellar Formation Thresholds**: Critical $H_2$ fraction, density threshold for collapse ($\rho_{\text{crit}} \sim 10^4\, \text{cm}^{-3}$), and the initial mass function (IMF) range of Population III stars ($10–1000 \, M_\odot$)</span>

-v-

## Benchmark Projects

- <span class="fragment">The **First Stars** Simulations (Abel, Bryan, Norman / Bromm et al. late 90s): Pioneer high-resolution collapse simulations establishing Pop III star formation in DM mini-haloes.</span>
- <span class="fragment">The **Millenium Simulation** (Springel 2005): $10^{10}$ purely dark matter particles. Updated in 2009 at higher resolution.</span>
<div style="text-align: center; width: 100%;"><iframe width="700" height="394" src="https://www.youtube.com/embed/yyfpFfWq7Bc" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="max-width: 100%; display: block; margin: 0 auto; class="r-stretch""></iframe></div>

-v-

## Benchmark Projects
- <span class="fragment">The **Renaissance Simulations** (Enzo): Ultra-high-resolution Adaptive Mesh Refinement (AMR) simulations exploring Population III/II star formation & early galaxy assembly. Suggested that low-mass, ultra-faint dwarf galaxies supplied most ionizing photons.</span>
- <span class="fragment">**CoDa** (Cosmic Dawn) Series (RAMSES-CORTEX): Fully coupled GPU-accelerated radiation-hydrodynamics simulations tracking the joint evolution of gas, stars, and ionizing radiation field.</span>
- <span class="fragment">**Flamingo** (Schaye et al. 2023): Largest-scale simulations (2.8Gpc) directly constraining upcoming survey observations (Euclid, Rubin, DESI, Roman)</span>

<h2 id="part-6" class="slide-part-title">Part 6: The Epoch of Reionization (EoR)</h2>

## The Three Phases of Reionization

- <span class="fragment">Phase 1: **Bubble Formation**:</span>
  - <span class="fragment">The first Pop III stars are embedded in neutral $H\ I$ gas.</span>
  - <span class="fragment">Their extremely high temperatures produce UV photons ionize immediate surroundings.</span>
  - <span class="fragment">The first generations of Pop II stars in proto-galaxies also contribute to these UV photons.</span>
  - <span class="fragment">Creates isolated spheres of $H\ II$ gas inside a vast ocean of neutral $H\ I$.</span>
- <span class="fragment">Phase 2: **Overlap (Percolation)**:</span>
  - <span class="fragment">Galaxies grow denser; ionized bubbles expand rapidly and merge together.</span>
  - <span class="fragment">Ionizing photon supply exceeds the recombination rate of the Intergalactic Medium (IGM).</span>

-v-

## The Three Phases of Reionization

- <span class="fragment">Phase 3: **Post-Overlap** ($z \sim 5.5\text{--}6$):</span>
  - <span class="fragment">Reionization finishes approximately 1 billion years after the Big Bang.</span>
  - <span class="fragment">The Intergalactic Medium becomes fully ionized ($>99.9\%$).</span>
- <span class="fragment">UV radiation can now travel freely across cosmic distances without being absorbed by neutral hydrogen.</span>

-v-

### 21cm line observations

- <span class="fragment">The spin-flip transition in neutral hydrogen ($\text{H I}$) emits or absorbs photons at $21.1\text{ cm}$ ($\nu_0 = 1420\text{ MHz}$)</span>
- <span class="fragment">Broad emission of radio photons, we can measure the differential brightness temperature ($\delta T_b$) of the $21\text{ cm}$ relative to the Cosmic Microwave Background (CMB):</span>
  - <span class="fragment">**Absorption** ($\delta T_b < 0$) when neutral gas absorbs CMB photons</span>
  - <span class="fragment">**Emission** ($\delta T_b > 0$): when heated gas glows brighter than the CMB background.</span>
- <span class="fragment">$21\text{ cm}$ transition is optically thin ($\tau \ll 1$; unlike Lyman-alpha forest)</span>
- <span class="fragment">Reionization of $H\ I$ by UV (e.g. produced by the first stars) is predicted to cause cooling of its spin temperature, producing an absorption signature.</span>

-v-

## The Photon Budget Problem

- <span class="fragment">To reionize the universe, ionizing photon production rate ($\dot{n}_{\text{ion}}$) must overcome both the neutral hydrogen density and the rate at which ionized gas recombines.</span>
- <span class="fragment">For reionization to complete by $z \sim 6$, the universe requires 1 -- 3 ionizing photons per hydrogen atom.</span>
- <span class="fragment">Initially, observations could not see enough ionizing photons from the identified galaxies/quasars to ionize the univere by $z\sim5$</span>
- <span class="fragment">Suggested we were missing an ultra-faint population of dwarf galaxies...</span>
- <span class="fragment">JWST detected this population, flipping the photon budget problem</span>
  - <span class="fragment">Now have *too many* UV photons to reionize after $z\sim8$</span>

### Observational evidence - Gravitational Waves

### Observational evidence - Gravitational Waves

- <span class="fragment">**LIGO** is now giving excellent statistics on the frequency & masses of the BH population</span>
  - <span class="fragment">Stellar evolution predicts a mass gap between $50<M_\odot<130$ where standard BHs should not form</span>
  - <span class="fragment">But black holes in the $50<M_\odot<80$ range are possible for Z=0 gas - *LIGO's high-mass BHs may be Pop. III stars.*</span>
  - <span class="fragment">[Cosmic Explorer](https://cosmicexplorer.org/) & [Einstein Telescope](https://einsteintelescope.eu/) could detect BH-BH mergers in the Cosmic Dark Ages ($z>20$)</span>
- <span class="fragment">**Pulsar timing** measures extremely large-wavelength GWs.</span>
  - <span class="fragment">NANOGrav found a [Gravitational Wave Background](https://iopscience.iop.org/collections/apjl-230623-245-Focus-on-NANOGrav-15-year) potentially due to waves from **binary SMBHs**</span>

<h2 id="part-8" class="slide-part-title">Part 8: New Frontiers with JWST</h2>

### The new most distant galaxies
- <span class="fragment">*JADES-GS-z14-0* ($z = 14.32$) & *MoM-z14* ($z = 14.44$): Confirmed spectroscopically via NIRSpec, thess galaxies are observed just $\lesssim 300 \text{ million years}$ after the Big Bang</span>
- <span class="fragment">Measured O & Ne lines - more metal-enriched than expected! Suggests multiple generations of star formation at $z > 14$</span>

### The [Impossible Early Galaxy](https://iopscience.iop.org/article/10.3847/0004-637X/824/1/21) Problem
- <span class="fragment">Overabundance of luminous/massive galaxies at $z = 10\text{--}15$</span>
- <span class="fragment">Models predicted these should only form by $z = 8$, but...</span>
  - <span class="fragment">Contamination from broadened emission lines was missed</span>
  - <span class="fragment">Top-heavy IMFs, high sSFR efficiency per burst, and dust-free environments make early galaxies unexpectedly bright</span>

-v-

### Rapid Black Hole creation
- Measurements of dynamical masses (e.g. AGN emission line profiles) imply large black holes  in [Abell 2744-QSO1](https://www.nature.com/articles/s41586-026-10579-4) ($z=7.04$, $5\times10^{7}M_\odot$), [CEERS-1019](https://ui.adsabs.harvard.edu/link_gateway/2023ApJ...953L..29L/PUB_HTML) ($z = 8.68$, $10^{7}M_\odot$) & [GN-z11](https://www.nature.com/articles/s41586-024-07052-5) ($z = 10.6$, $2\times10^{6}M_\odot$)
  - <span class="fragment">Requires SMBH mass ratios of $1\%\text{--}10\%$, $>$10-100x than local universe.</span>
- <span class="fragment">Shows SMBHs grew *faster than their host galaxies* - evidence for *heavy seed* formation models</span>

## Little Red Dots - MoM-BH*
- <span class="fragment">[Naidu et al](https://www.nature.com/articles/s41586-026-10846-4) studied an extremely red LRD ($z=7.76$)</span>
- UV shows low stellar mass (dwarf galaxy)
- <span class="fragment">Large neighbouring galaxy likely to merge in $<100$Myr</span>
- <span class="fragment">Strong Balmer lines (highly broadened), and a very deep "Balmer break" at 4000Å</span>
- <span class="fragment">The Hβ & Hγ absorption implies extremely dense gas</span>

## Little Red Dots - Cocooned SMBH

<div style="text-align: center; width: 100%;"><img src="../slide_data/slide_images/ProtoLRD_model.png" style="height: 350px;" /></div>

- <span class="fragment">Suggests a $10^6 M_\odot$ SMBH with AGN all deeply enshrouded in gas</span>
- <span class="fragment">Extremely rapid accretion of gas could explain rapid SMBHs growth</span>
- <span class="fragment">This model combined with star-forming galaxy could explain LRDs</span>
- <span class="fragment">Higher-resolution [spectrum of GLIMPSE-17775](https://iopscience.iop.org/article/10.3847/1538-4357/ae4ed7/pdf) also matches perfectly gas-cocooned SMBH model.</span>
