<h2 id="part-1" class="slide-part-title">Part 1: Star Formation in our Milky Way</h2>

<div style="text-align: center; width: 100%;"><img src="../slide_data/slide_images/Herschel_molecular_clouds.jpg" class="r-stretch" /></div>

- <span class="fragment">Stars ($1$ ${\rm g}.{\rm cm}^{-3}$) are 24 orders of magnitude more dense than galaxies ($10^{-24}$ ${\rm g}.{\rm cm}^{-3}$)</span>
- <span class="fragment">Yet our universe is very good at star formation...</span>

-v-

## Star formation in the Milky Way
- <span class="fragment">Jeans' Mass determines when self-gravitation and "collapse" can occur: $M_J \propto \left(\frac{T}{\mu}\right)^{3/2} \rho^{-1/2}$.</span>
- <span class="fragment">For a given mass of some cloud of gas & dust, it must be both **dense** and **cold**.</span>
- <span class="fragment">Our galaxy's disc is filled with warm, low-density "neutral medium" ($H\text{ I}$, $T \sim 8000\text{ K}$, $n \sim 0.5\text{ cm}^{-3}$), but shocks (e.g. from SN) cause this to locally compress.</span>
- <span class="fragment">Cooling scales with $n^2$, so densified gas quickly cools, especially through emission from metal lines (e.g. $[\text{C II}] \,\, 158\,\mu\text{m}$ line).</span>
- <span class="fragment">Once a cloud is cold enough, atoms form molecules (e.g. H+H$\to$H$_2$, C+O$\to$CO$, helped by dust shielding UV), giving us their name: **molecular clouds**</span>

-v-
## Star formation in the Milky Way
- <span class="fragment">These dense ($n \sim 30\text{ cm}^{-3}$), cold ($T \sim 50\text{--}100\text{ K}$) environments have lower Jeans mass and can graviationally collapse.</span>
- <span class="fragment">Additional fragmentation through turbulence/etc typically split $\sim 1\text{--}2 \, M_\odot$ pre-stellar cores into the $\sim 0.1\text{--}0.5 \, M_\odot$ peak seen in the initial mass function (IMF).</span>

<h2 id="part-2" class="slide-part-title">Part 2: The Primordial Universe</h2>
__HTML_COMMENT_TOKEN_1__

### Big Bang Nucleosynthesis:

- <span class="fragment">Created (in $t \approx 3\text{--}20$ mins):</span>
  - <span class="fragment">Hydrogen ($^1\text{H}$): $\approx 0.75$ (75% by mass, ~92% by number)</span>
  - <span class="fragment">Helium ($^4\text{He}$): $\approx 0.25$ (25% by mass, ~8% by number)</span>
  - <span class="fragment">Light Trace Isotopes: $D/H \sim 2.5 \times 10^{-5}$, $^3\text{He}/H \sim 10^{-5}$, $^7\text{Li}/H \sim 10^{-10}$</span>
- <span class="fragment">Metallicity: $Z = 0.00$ — Absolutely *zero* carbon, oxygen, iron, or dust grains exist prior to the first generation of stars.</span>

-v-

#### Reminder: THE COSMIC REDSHIFT RULER (Planck 2018 ΛCDM)

<div style="text-align: center; width: 100%;"><img src="../slide_data/slide_images/cosmic_ruler_full.jpg" class="r-stretch" /></div>

-v-
__HTML_COMMENT_TOKEN_2__

### First Star Formation
- <span class="fragment">**No metal cooling**: Without metal lines, which can cool gas to  $\sim 10\text{ K}$, zero-metal gas remains hot $T_{\text{min}} \sim 200\text{--}300\text{ K}$ with fast sound speed, which inhibits gas collapse at low mass.</span>
- <span class="fragment">**Population III IMF**: High thermal pressure raises the Jeans Mass ($M_J \propto T^{3/2} \rho^{-1/2}$), driving initial star formation dominated by extremely massive stars ($M_* \sim 10\text{--}100+ M_\odot$) - a "top-heavy" Initial Mass Function</span>
- <span class="fragment">**Nucleosynthetic Enrichment**: End states via Pair-Instability Supernovae (PISNe) and core-collapse events eject initial metals ($C, O, Mg, Fe$).</span>
- <span class="fragment">**Pop III $\to$ Pop II Transition**: Crossing critical metallicity ($Z_{\text{crit}} \approx 10^{-5.5}\text{--}10^{-4} \, Z_\odot$) enables dust/metal cooling, triggering low-mass fragmentation and normal IMF star formation.</span>

-v-

### A Gas-rich universe

- <span class="fragment">Dark matter filaments and halos (except those $M_{\text{halo}} \gt 10^{12} M_\odot$) accrete cold gas directingly into galaxy discs without shock heating.</span>
- <span class="fragment">This meant very high gas fractions, $f_{\text{gas}} \equiv M_{\text{gas}} / (M_* + M_{\text{gas}}) \sim 30\text{--}80\%$.</span>
- <span class="fragment">High surface gas density fragmented discs into into clumps (so-called **Toomre instability**), causing highly efficient star formation.</span>
- <span class="fragment">High galaxy densities also meant many "wet" mergers driving gas inflows.</span>

[p "Cosmic History of Star Formation: Observations"]

## The Madau-Dickinson Relation ($\psi_{\text{SFRD}}$)

<div style="text-align: center; width: 100%;"><img src="../slide_data/slide_images/SFRD_evolution.png" class="r-stretch" /></div>

- <span class="fragment">Cosmic Star Formation Rate Density (SFRD, or $\psi(z)$ in $M_\odot \text{ yr}^{-1} \text{ Mpc}^{-3}$):</span>
  - <span class="fragment">Rises during early epoch as gas-rich galaxies form/merge</span>
  - <span class="fragment">Peaks at **Cosmic Noon** ($z \approx 1.5\text{--}2.5$)</span>
Note:
- Half of stellar mass was formed at/before cosmic noon
- SFR has decayed exponentially (0.1x) since this period
-v-

## Cosmic Star Formation Rate Density

## Stellar Mass Density Accumulation

- <span class="fragment">Stellar Mass Growth ($\rho_*(z) = \int \psi(z) (1-R) \, dz$):</span>
  - <span class="fragment">Total stellar mass density $\rho_*(z)$ grows monotonically, reaching 50% of current local budget by $z \sim 1$.</span>
  - <span class="fragment">Mass return fraction ($R \approx 0.3\text{--}0.5$) accounts for mass returned to ISM via stellar winds and SNe.</span>
- <span class="fragment">Mass-Dependent Star Formation Histories ("Downsizing"):</span>
  - <span class="fragment">*Massive Galaxies ($M_ > 10^{11} M_\odot$):* Formed the bulk of their stars in early, intense starbursts at $z > 2$ and underwent rapid **quenching**.</span>
  - <span class="fragment">*Low-Mass Galaxies ($M_ < 10^9 M_\odot$):* Exhibit extended, gradual star-formation histories peaking late ($z < 0.5$).</span>

<h2 id="part-3" class="slide-part-title">Part 3: Downsizing, Feedback & Quenching</h2>

## Downsizing in Star Formation
- <span class="fragment">We observe that massive galaxies form the bulk of their stellar mass early and rapidly.</span>
- <span class="fragment">This star formation appears to shut-off rapidly, with no recent star formation in elliptical galaxies</span>
- <span class="fragment">Modern massive elliptical galaxies host extremely old, but also metal-rich stellar populations</span>
- <span class="fragment">In lower-mass galaxies star-formation is systematically shifted later.</span>

- <span class="fragment">One question is: why did the universe's most massive galaxies stop growing billions of years ago?</span>

Note:
- Specific SFR ($sSFR$): Ratio $sSFR = \text{SFR} / M_*$ declines universally, but remains elevated in low-mass systems at late times.
-v-

## Feedback Mechanisms

- Ongoing star formation impacts the availability of cold gas
- <span class="fragment">*Small galaxies* ($M_* \lesssim 10^{10.5} M_\odot$) - **Supernova-dominated**:</span>
  - <span class="fragment">Energy/momentum from core-collapse supernovae drives galactic winds ($v \sim 100\text{--}500\text{ km s}^{-1}$).</span>
  - <span class="fragment">Central Black Holes (AGNs) drives episodic outflows, especially during major accretion/merger events.</span>
- <span class="fragment">*Massive Ellipticals* ($M_* \gtrsim 10^{10.5} M_\odot)$) - **AGN-Dominated**:</span>
  - <span class="fragment">Radio-mode (kinetic / maintenance) and Quasar-mode (ejective) AGN feedback dominate feedback.</span>
  - <span class="fragment">High gravity means infalling cold gas is shock-heated to high temps ($T \sim 10^6\text{ K}$).</span>
  - <span class="fragment">Both mechanisms inject energy into hot halo gas, offsetting radiative cooling.</span>

Note:
- Physical Mechanism: SN energy is insufficient to lift gas out of deep potential wells.
__HTML_COMMENT_TOKEN_5__

## Quenching Paths: Blue Cloud to Red Sequence

<div style="text-align: center; width: 100%;"><img src="../slide_data/slide_images/color_magnitude_plot.png" class="r-stretch" /></div>

- <span class="fragment">**Quenching** is the rapid or slow shutdown of star formation.</span>
- <span class="fragment">Observationally, this moves galaxies through the *Green Valley* to the passive *Red Sequence*.</span>


-v-

## 1) Quenching by Starvation: Cut off the Supply
- <span class="fragment">Feedback mechanisms mean a galaxy's outer reservoir of halo gas is stripped or prevented from cooling, cutting supply of cold gas.</span>
- <span class="fragment">Star formation continues uninterrupted, burning through the remaining internal cold molecular gas reservoir in the disk.</span>
- <span class="fragment">Star formation gradually dies over long timescales ($\sim 1\text{--}3\text{ Gyr}$).</span>
-v-

## 2) Morphological Quenching: Stabilizing the Gas Disk

- <span class="fragment">A large central bulge increases differential rotation and gravitational shear, quantified by the epicyclic frequency ($\kappa$).</span>
- <span class="fragment">**Toomre Criterion**: This high shear drives Toomre's stability parameter above the threshold for gravitational fragmentation ($Q = \frac{c_s \kappa}{\pi G \Sigma_{\text{gas}}} > 1$).</span>
- <span class="fragment">Cold gas remains present inside the disk, but strong gravitational shear prevents it from fragmenting into dense, starbursting clumps.</span>
 
-v-

## 3) Environmental Quenching: Satellite & Cluster Effects
- In dense cluster environments, interactions between galaxies results in quenching.
- <span class="fragment">As a satellite plunges through the dense hot Intra-Cluster Medium (ICM), wind drag overcomes galactic gravity and blows cold disk gas out through **Ram Pressure Stripping**</span>
- <span class="fragment">**Harassment & Tidal Stripping** is when high-speed flybys with neighbours & tidal forces within the cluster gravitationally tear gas out of the satellite.</span>
- <span class="fragment">This ejected cold gas on short timescales ($\lesssim 100\text{--}500\text{ Myr}$), leaving a passive satellite galaxy.</span>

Note:
- <span class="fragment">$$P_{\text{ram}} = \rho_{\text{ICM}} v^2 > F_{\text{grav}}$$</span>

<h2 id="part-5" class="slide-part-title">Part 5: Chemical & Morphological Impacts</h2>

### $[\alpha/\text{Fe}]$ Element Ratios as Cosmic Clocks
- <span class="fragment">Core-Collapse SNe (Type II) enrich ISM predominantly with $\alpha$-elements ($O, Mg, Si, Ca$) in $\lesssim 10\text{ Myr}$</span>
- <span class="fragment">Thermonuclear SNe (Type Ia) yield dominant iron-peak elements ($Fe, Ni$) but on longer timescales ($\sim 0.1\text{--}1\text{ Gyr}$).</span>
- <span class="fragment">Hence, **High $[\alpha/\text{Fe}]$** $=$ **Intense starburst** completed before Type Ia onset (e.g., massive ellipticals).</span>
- <span class="fragment">**Solar/Low $[\alpha/\text{Fe}]$** $=$ **Extended star formation** allowing Type Ia products to pollute gas (e.g., spiral disks).</span>
- <span class="fragment">$[\alpha/\text{Fe}]$ vs. $[\text{Fe}/\text{H}]$ therefore tracks star formation duration independent of direct lookback redshift.</span>
 
-v-

## Morphological & Structural Evolution
- <span class="fragment">Gas Kinematics: Structural shift from dispersion-dominated, turbulent, clumpy disks ($z \sim 2$) to settled, rotationally supported disks ($z \sim 0$).</span>
- <span class="fragment">Bulge Assembly: Driven by inward migration of giant disk clumps, major/minor mergers, and secular gas inflows.</span>
- <span class="fragment">Structural Transformation: Quenching strongly correlates with increased central stellar density ($\Sigma_1$) and high Sersic index ($n > 2.5$).</span>
- <span class="fragment">Bimodality Emergence: Clear structural, color ($U-V$), and star formation rate density bimodalities established across cosmic time.</span>
